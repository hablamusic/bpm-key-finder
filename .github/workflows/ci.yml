name: tests
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  node:
    runs-on: ubuntu-latest
    strategy: { matrix: { node: ["18", "22"] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      - run: node test/run.js
      - run: node bin/bpm-key-finder.js --help
      - name: web copy of the engine matches src
        run: cmp src/analyze.js docs/lib/analyze.js && cmp src/keys.js docs/lib/keys.js
